<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ลงเวลา">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ลงเวลาเข้า-ออกงาน</title>
<style>
  :root {
    --bg:#f4f6f8; --card:#fff; --text:#1f2933; --muted:#6b7785;
    --green:#16a34a; --red:#e5484d; --blue:#2563eb; --line:#e3e8ee;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Sarabun","Noto Sans Thai",sans-serif; background:var(--bg); color:var(--text); padding:16px; padding-bottom:32px; }
  .wrap { max-width:480px; margin:0 auto; }
  .card { background:var(--card); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  h1 { font-size:18px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:14px; }
  .clock { font-size:40px; font-weight:700; text-align:center; letter-spacing:1px; margin:6px 0 0; }
  .date { text-align:center; color:var(--muted); font-size:14px; }
  .pill { display:inline-block; padding:4px 12px; border-radius:999px; font-size:13px; font-weight:600; }
  .ok { background:#e7f9ee; color:#087f3c; }
  .bad { background:#fdecec; color:#b4232a; }
  .wait { background:#eef2f7; color:var(--muted); }
  button, .btn { width:100%; border:0; border-radius:14px; padding:16px; font-size:17px; font-weight:700; color:#fff; background:var(--green); cursor:pointer; display:block; text-align:center; }
  button.out, .btn.out { background:var(--red); }
  button.primary { background:var(--blue); }
  button.gray { background:#e3e8ee; color:var(--text); }
  button.link { background:none; color:var(--muted); font-size:14px; font-weight:500; padding:8px; width:auto; display:inline-block; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  input[type=text], input[type=password] { width:100%; padding:14px; font-size:17px; border:1px solid var(--line); border-radius:12px; margin:8px 0; }
  .row { display:flex; justify-content:space-between; align-items:center; margin:8px 0; font-size:15px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; }
  .preview { width:100%; border-radius:12px; margin:10px 0; display:block; }
  .msg { padding:12px 14px; border-radius:12px; margin-top:12px; font-size:15px; }
  .msg.err { background:#fdecec; color:#b4232a; }
  .msg.good { background:#e7f9ee; color:#087f3c; }
  .log { font-size:15px; display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); }
  .log:last-child { border:0; }
  .hidden { display:none !important; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div class="wrap">

  <!-- เข้าสู่ระบบ -->
  <div id="loginView" class="card hidden">
    <h1>เข้าสู่ระบบลงเวลา</h1>
    <div class="muted" id="loginHint">กรอกรหัสพนักงานและ PIN</div>
    <input type="text" id="empCode" placeholder="รหัสพนักงาน" autocomplete="username" autocapitalize="off">
    <input type="password" id="pin" placeholder="PIN 4-6 หลัก" inputmode="numeric" maxlength="6" autocomplete="current-password">
    <input type="password" id="pin2" class="hidden" placeholder="ยืนยัน PIN อีกครั้ง" inputmode="numeric" maxlength="6" autocomplete="new-password">
    <button id="loginBtn" class="primary">เข้าสู่ระบบ</button>
    <div id="loginMsg"></div>
  </div>

  <!-- หน้าหลัก -->
  <div id="mainView" class="hidden">
    <div class="card">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="dateText"></div>
    </div>

    <div class="card">
      <div class="top">
        <div>
          <h1 id="empName">-</h1>
          <div class="muted" id="empCode2"></div>
        </div>
        <button class="link" id="logoutBtn">ออกจากระบบ</button>
      </div>
      <div class="row" style="margin-top:12px">
        <span>ตำแหน่งปัจจุบัน</span>
        <span id="gpsPill" class="pill wait">กำลังหาตำแหน่ง...</span>
      </div>
      <div class="row">
        <span>ระยะจากสาขา</span><span id="distText">-</span>
      </div>
    </div>

    <div class="card">
      <label class="btn" id="takePhotoBtn" for="photoInput">📷 ถ่ายรูปเพื่อลงเวลา</label>
      <input type="file" id="photoInput" accept="image/*" capture="user">
      <div id="previewBox" class="hidden">
        <img id="previewImg" class="preview" alt="รูปที่ถ่าย">
        <button id="submitBtn">ยืนยัน</button>
        <button id="retakeBtn" class="gray" style="margin-top:8px">ถ่ายใหม่</button>
      </div>
      <div id="actionMsg"></div>
    </div>

    <div class="card">
      <div class="muted" style="margin-bottom:6px">บันทึกวันนี้</div>
      <div id="todayLog"><div class="muted">ยังไม่มีบันทึก</div></div>
    </div>
  </div>

  <div id="loading" class="card"><div class="muted" style="text-align:center">กำลังโหลด...</div></div>
</div>

<script>
/* ===== ตั้งค่า: ใส่ URL Web App ของ Apps Script (ลงท้าย /exec) ===== */
const API_URL = https://script.google.com/macros/s/AKfycbyRsDB_c062D4bFtdCO37pFRWxn9WRUmMIf5qROMr8iZQ0yNqrGjykYdEGl8YCVbT_IIQ/exec;
/* ================================================================ */

const $ = id => document.getElementById(id);
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  del: k => { try { localStorage.removeItem(k); } catch (e) {} }
};
let state = { branch:null, nextType:'in', photo:null, busy:false, needSetPin:false, started:false };

// รหัสอุปกรณ์แบบสุ่ม เก็บไว้ในเครื่อง ใช้ตรวจย้อนหลังว่าลงเวลาจากเครื่องไหน
let deviceId = store.get('deviceId');
if (!deviceId) {
  deviceId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).slice(0, 36);
  store.set('deviceId', deviceId);
}

/* ---------- เรียก backend (text/plain เพื่อเลี่ยง CORS preflight) ---------- */
async function api(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return res.json();
}

function show(id) {
  ['loading','loginView','mainView'].forEach(v => $(v).classList.toggle('hidden', v !== id));
}
function setMsg(el, text, kind) {
  el.innerHTML = '';
  if (!text) return;
  const d = document.createElement('div');
  d.className = 'msg ' + kind;
  d.textContent = text;
  el.appendChild(d);
}

/* ---------- เริ่มต้น ---------- */
async function init() {
  const savedCode = store.get('empCode');
  if (savedCode) $('empCode').value = savedCode;
  if (!store.get('token')) { show('loginView'); return; }
  try {
    await loadStatus();
  } catch (e) {
    if (e.code === 'AUTH') { store.del('token'); show('loginView'); setMsg($('loginMsg'), e.message, 'err'); }
    else { show('loginView'); setMsg($('loginMsg'), 'เชื่อมต่อไม่ได้: ' + e.message, 'err'); }
  }
}

async function loadStatus() {
  const r = await api({ action:'status', token:store.get('token') });
  if (!r.ok) { const e = new Error(r.error); e.code = r.code; throw e; }
  state.branch = r.branch;
  $('empName').textContent = r.employee.name;
  $('empCode2').textContent = 'รหัส ' + r.employee.code;
  state.nextType = r.nextType;
  renderToday(r.today);
  updateButton();
  show('mainView');
  if (!state.started) { state.started = true; startClock(); startGps(); }
}

/* ---------- เข้าสู่ระบบ ---------- */
async function doLogin() {
  const code = $('empCode').value.trim();
  const pin = $('pin').value.trim();
  if (!code) return setMsg($('loginMsg'), 'กรุณากรอกรหัสพนักงาน', 'err');
  if (!/^\d{4,6}$/.test(pin)) return setMsg($('loginMsg'), 'PIN ต้องเป็นตัวเลข 4-6 หลัก', 'err');

  if (state.needSetPin && pin !== $('pin2').value.trim()) {
    return setMsg($('loginMsg'), 'PIN ทั้งสองช่องไม่ตรงกัน', 'err');
  }

  $('loginBtn').disabled = true;
  setMsg($('loginMsg'), '');
  try {
    const r = await api({ action: state.needSetPin ? 'setpin' : 'login', employeeCode:code, pin });
    if (!r.ok) {
      if (r.code === 'NEED_SET_PIN') {
        state.needSetPin = true;
        $('pin2').classList.remove('hidden');
        $('loginHint').textContent = 'เข้าใช้งานครั้งแรก กรุณาตั้ง PIN (ตัวเลข 4-6 หลัก) และกรอกยืนยัน';
        $('loginBtn').textContent = 'ตั้ง PIN และเข้าสู่ระบบ';
        return;
      }
      throw new Error(r.error);
    }
    store.set('token', r.token);
    store.set('empCode', r.employee.code);
    $('pin').value = ''; $('pin2').value = '';
    state.needSetPin = false;
    $('pin2').classList.add('hidden');
    $('loginBtn').textContent = 'เข้าสู่ระบบ';
    $('loginHint').textContent = 'กรอกรหัสพนักงานและ PIN';
    await loadStatus();
  } catch (e) {
    setMsg($('loginMsg'), e.message, 'err');
  } finally { $('loginBtn').disabled = false; }
}
$('loginBtn').onclick = doLogin;
['empCode','pin','pin2'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));
$('empCode').addEventListener('input', () => {
  if (state.needSetPin) { // เปลี่ยนรหัสพนักงาน ให้กลับไปโหมดปกติ
    state.needSetPin = false; $('pin2').classList.add('hidden');
    $('loginBtn').textContent = 'เข้าสู่ระบบ'; $('loginHint').textContent = 'กรอกรหัสพนักงานและ PIN';
  }
});

$('logoutBtn').onclick = () => {
  store.del('token');
  state.photo = null;
  resetPhoto();
  setMsg($('actionMsg'), '');
  show('loginView');
};

/* ---------- นาฬิกา ---------- */
function startClock() {
  const tick = () => {
    const d = new Date();
    $('clock').textContent = d.toLocaleTimeString('th-TH', { hour12:false });
    $('dateText').textContent = d.toLocaleDateString('th-TH', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  };
  tick(); setInterval(tick, 1000);
}

/* ---------- GPS ---------- */
function distanceM(lat1, lng1, lat2, lng2) {
  const R = 6371000, rad = Math.PI/180;
  const dLat = (lat2-lat1)*rad, dLng = (lng2-lng1)*rad;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function startGps() {
  if (!navigator.geolocation) {
    $('gpsPill').className = 'pill bad'; $('gpsPill').textContent = 'อุปกรณ์ไม่รองรับ GPS'; return;
  }
  navigator.geolocation.watchPosition(pos => {
    const d = distanceM(pos.coords.latitude, pos.coords.longitude, state.branch.lat, state.branch.lng);
    const inside = d <= state.branch.radiusM;
    $('distText').textContent = Math.round(d) + ' ม. (GPS ±' + Math.round(pos.coords.accuracy) + ' ม.)';
    $('gpsPill').className = 'pill ' + (inside ? 'ok' : 'bad');
    $('gpsPill').textContent = inside ? 'อยู่ในพื้นที่' : 'อยู่นอกพื้นที่';
  }, err => {
    $('gpsPill').className = 'pill bad';
    $('gpsPill').textContent = err.code === 1 ? 'ยังไม่อนุญาตตำแหน่ง' : 'หาตำแหน่งไม่ได้';
  }, { enableHighAccuracy:true, maximumAge:5000, timeout:20000 });
}

function getFreshPosition() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(p => resolve(p.coords),
      e => reject(new Error(e.code === 1 ? 'กรุณาอนุญาตการเข้าถึงตำแหน่งในเบราว์เซอร์/มือถือ' : 'หาตำแหน่งไม่ได้ กรุณาลองใหม่')),
      { enableHighAccuracy:true, maximumAge:0, timeout:20000 });
  });
}

/* ---------- ปุ่ม/รายการ ---------- */
function updateButton() {
  const isIn = state.nextType === 'in';
  $('takePhotoBtn').textContent = isIn ? '📷 ถ่ายรูปเพื่อลงเวลาเข้างาน' : '📷 ถ่ายรูปเพื่อลงเวลาออกงาน';
  $('takePhotoBtn').className = 'btn' + (isIn ? '' : ' out');
  $('submitBtn').textContent = isIn ? 'ยืนยันเข้างาน' : 'ยืนยันออกงาน';
  $('submitBtn').className = isIn ? '' : 'out';
}

function renderToday(list) {
  const box = $('todayLog');
  box.innerHTML = '';
  if (!list || !list.length) { box.innerHTML = '<div class="muted">ยังไม่มีบันทึก</div>'; return; }
  list.forEach(r => {
    const row = document.createElement('div'); row.className = 'log';
    const a = document.createElement('span'); a.textContent = r.type === 'in' ? '🟢 เข้างาน' : '🔴 ออกงาน';
    const b = document.createElement('b'); b.textContent = r.time;
    row.append(a, b); box.appendChild(row);
  });
}

/* ---------- ถ่ายรูป + ย่อขนาด ---------- */
$('photoInput').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    state.photo = await compress(file, 640, 0.7);
    $('previewImg').src = state.photo;
    $('previewBox').classList.remove('hidden');
    $('takePhotoBtn').classList.add('hidden');
    setMsg($('actionMsg'), '');
  } catch (err) {
    setMsg($('actionMsg'), 'อ่านรูปไม่สำเร็จ กรุณาถ่ายใหม่', 'err');
  }
};

function compress(file, maxW, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxW / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = url;
  });
}

$('retakeBtn').onclick = resetPhoto;
function resetPhoto() {
  state.photo = null;
  $('previewBox').classList.add('hidden');
  $('takePhotoBtn').classList.remove('hidden');
}

/* ---------- ยืนยันลงเวลา ---------- */
$('submitBtn').onclick = async () => {
  if (state.busy) return;
  state.busy = true;
  $('submitBtn').disabled = true; $('retakeBtn').disabled = true;
  setMsg($('actionMsg'), 'กำลังตรวจตำแหน่งและบันทึก...', 'good');
  try {
    const p = await getFreshPosition();
    const r = await api({
      action:'checkin', token:store.get('token'), type:state.nextType,
      lat:p.latitude, lng:p.longitude, accuracy:p.accuracy,
      photo:state.photo, deviceId
    });
    if (!r.ok) { const e = new Error(r.error); e.code = r.code; throw e; }
    setMsg($('actionMsg'), (r.type === 'in' ? 'ลงเวลาเข้างานสำเร็จ ' : 'ลงเวลาออกงานสำเร็จ ') + r.time, 'good');
    resetPhoto();
    await refreshToday();
  } catch (e) {
    if (e.code === 'AUTH') { store.del('token'); show('loginView'); setMsg($('loginMsg'), e.message, 'err'); }
    else setMsg($('actionMsg'), e.message, 'err');
  } finally {
    state.busy = false;
    $('submitBtn').disabled = false; $('retakeBtn').disabled = false;
  }
};

async function refreshToday() {
  try {
    const r = await api({ action:'status', token:store.get('token') });
    if (r.ok) { state.nextType = r.nextType; renderToday(r.today); updateButton(); }
  } catch (e) {}
}

init();
</script>
</body>
</html>
