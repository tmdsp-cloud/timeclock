<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ลงเวลา">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ลงเวลาเข้า-ออกงาน</title>
<style>
  :root {
    --bg:#f4f6f8; --card:#fff; --text:#1f2933; --muted:#6b7785;
    --green:#16a34a; --red:#e5484d; --blue:#2563eb; --line:#e3e8ee;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Sarabun","Noto Sans Thai",sans-serif; background:var(--bg); color:var(--text); padding:16px; padding-bottom:32px; }
  .wrap { max-width:480px; margin:0 auto; }
  .card { background:var(--card); border-radius:16px; padding:18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  h1 { font-size:18px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:14px; }
  .clock { font-size:40px; font-weight:700; text-align:center; letter-spacing:1px; margin:6px 0 0; }
  .date { text-align:center; color:var(--muted); font-size:14px; }
  .pill { display:inline-block; padding:4px 12px; border-radius:999px; font-size:13px; font-weight:600; }
  .ok { background:#e7f9ee; color:#087f3c; }
  .bad { background:#fdecec; color:#b4232a; }
  .wait { background:#eef2f7; color:var(--muted); }
  button, .btn { width:100%; border:0; border-radius:14px; padding:16px; font-size:17px; font-weight:700; color:#fff; background:var(--green); cursor:pointer; display:block; text-align:center; }
  button.out, .btn.out { background:var(--red); }
  button.primary { background:var(--blue); }
  button.gray { background:#e3e8ee; color:var(--text); }
  button.danger { background:var(--red); }
  button.link { background:none; color:var(--muted); font-size:14px; font-weight:500; padding:8px; width:auto; display:inline-block; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  input[type=text], input[type=password], input[type=date], select { width:100%; padding:14px; font-size:17px; border:1px solid var(--line); border-radius:12px; margin:8px 0; background:#fff; color:var(--text); }
  input[readonly] { background:#f1f4f7; color:var(--muted); }
  .row { display:flex; justify-content:space-between; align-items:center; margin:8px 0; font-size:15px; }
  .top { display:flex; justify-content:space-between; align-items:flex-start; }
  .preview { width:100%; border-radius:12px; margin:10px 0; display:block; }
  .msg { padding:12px 14px; border-radius:12px; margin-top:12px; font-size:15px; }
  .msg.err { background:#fdecec; color:#b4232a; }
  .msg.good { background:#e7f9ee; color:#087f3c; }
  .log { font-size:15px; display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); }
  .log:last-child { border:0; }
  .hidden { display:none !important; }
  input[type=file] { display:none; }

  /* จัดการพนักงาน */
  .emp { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:12px 0; border-bottom:1px solid var(--line); }
  .emp:last-child { border:0; }
  .emp.click { cursor:pointer; }
  .emp.dim { opacity:.6; }
  .emp .nm { font-weight:600; font-size:16px; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  .badge { font-size:12px; padding:2px 8px; border-radius:999px; background:#eef2f7; color:var(--muted); font-weight:600; white-space:nowrap; }
  .badge.admin { background:#ede9fe; color:#5b21b6; }
  .badge.hr { background:#dbeafe; color:#1d4ed8; }
  .badge.off { background:#fdecec; color:#b4232a; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:10; }
  .sheet { background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:18px; max-height:92vh; overflow:auto; }
  label.chk { display:flex; align-items:center; gap:10px; margin:10px 0; font-size:16px; }
  label.chk input { width:20px; height:20px; }
  .days { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; }
  .days label { display:flex; align-items:center; gap:6px; padding:8px 12px; border:1px solid var(--line); border-radius:999px; font-size:15px; }
  .actions { display:flex; gap:8px; margin-top:8px; }
  .actions button { flex:1; padding:14px 8px; font-size:15px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- เข้าสู่ระบบ -->
  <div id="loginView" class="card hidden">
    <h1>เข้าสู่ระบบลงเวลา</h1>
    <div class="muted" id="loginHint">กรอกรหัสพนักงานและ PIN</div>
    <input type="text" id="empCode" placeholder="รหัสพนักงาน" autocomplete="username" autocapitalize="off">
    <input type="password" id="pin" placeholder="PIN 4-6 หลัก" inputmode="numeric" maxlength="6" autocomplete="current-password">
    <input type="password" id="pin2" class="hidden" placeholder="ยืนยัน PIN อีกครั้ง" inputmode="numeric" maxlength="6" autocomplete="new-password">
    <button id="loginBtn" class="primary">เข้าสู่ระบบ</button>
    <div id="loginMsg"></div>
  </div>

  <!-- หน้าหลัก -->
  <div id="mainView" class="hidden">
    <div class="card">
      <div class="clock" id="clock">--:--:--</div>
      <div class="date" id="dateText"></div>
    </div>

    <div class="card">
      <div class="top">
        <div>
          <h1 id="empName">-</h1>
          <div class="muted" id="empCode2"></div>
        </div>
        <button class="link" id="logoutBtn">ออกจากระบบ</button>
      </div>
      <button id="manageBtn" class="gray hidden" style="margin-top:12px">👥 จัดการพนักงาน</button>
      <div class="muted" id="schedText" style="margin-top:10px"></div>
      <div id="gpsRows">
        <div class="row" style="margin-top:12px">
          <span>ตำแหน่งปัจจุบัน</span>
          <span id="gpsPill" class="pill wait">กำลังหาตำแหน่ง...</span>
        </div>
        <div class="row">
          <span>ระยะจากสาขา</span><span id="distText">-</span>
        </div>
      </div>
    </div>

    <div class="card" id="clockCard">
      <button type="button" id="takePhotoBtn" class="btn">📷 ถ่ายรูปเพื่อลงเวลา</button>
      <input type="file" id="photoInput" accept="image/*" capture="user">
      <div id="previewBox" class="hidden">
        <img id="previewImg" class="preview" alt="รูปที่ถ่าย">
        <button id="submitBtn">ยืนยัน</button>
        <button id="retakeBtn" class="gray" style="margin-top:8px">ถ่ายใหม่</button>
      </div>
      <div id="actionMsg"></div>
    </div>

    <div class="card" id="logCard">
      <div class="muted" style="margin-bottom:6px">บันทึกวันนี้</div>
      <div id="todayLog"><div class="muted">ยังไม่มีบันทึก</div></div>
    </div>
  </div>

  <!-- จัดการพนักงาน (HR / ผู้ดูแลระบบ) -->
  <div id="manageView" class="hidden">
    <div class="card">
      <div class="top">
        <h1>จัดการพนักงาน</h1>
        <button class="link" id="backBtn">← กลับ</button>
      </div>
      <input type="text" id="searchBox" placeholder="ค้นหารหัสหรือชื่อ" autocomplete="off">
      <button id="addEmpBtn" class="primary">+ เพิ่มพนักงาน</button>
      <div id="manageMsg"></div>
    </div>
    <div class="card" id="empList"></div>
  </div>

  <div id="loading" class="card"><div class="muted" style="text-align:center">กำลังโหลด...</div></div>
</div>

<!-- กล้องถ่ายรูปลงเวลา -->
<div id="camModal" class="modal hidden">
  <div class="sheet" style="padding:12px">
    <video id="camVideo" autoplay playsinline muted style="width:100%;border-radius:12px;background:#000;transform:scaleX(-1)"></video>
    <button type="button" id="shutterBtn" style="margin-top:10px">📸 ถ่ายรูป</button>
    <div style="text-align:center;margin-top:6px"><button type="button" id="camCancel" class="link">ยกเลิก</button></div>
    <div id="camMsg"></div>
  </div>
</div>

<!-- ฟอร์มเพิ่ม/แก้ไขพนักงาน -->
<div id="modal" class="modal hidden">
  <div class="sheet">
    <h1 id="mTitle">เพิ่มพนักงาน</h1>
    <input type="text" id="mCode" placeholder="รหัสพนักงาน (A-Z 0-9 _ -)" autocapitalize="off" autocomplete="off">
    <input type="text" id="mName" placeholder="ชื่อ-สกุล" autocomplete="off">
    <div class="muted" style="margin-top:6px">ตำแหน่ง</div>
    <select id="mPos"></select>
    <div class="muted" style="margin-top:6px">วันเริ่มงาน</div>
    <input type="date" id="mStart">
    <div class="muted">วันเกิด</div>
    <input type="date" id="mBirth">
    <input type="text" id="mSalary" inputmode="decimal" placeholder="เงินเดือน (บาท)" autocomplete="off">
    <div id="mRoleWrap">
      <div class="muted" style="margin-top:6px">สิทธิ์การใช้งาน</div>
      <select id="mRole">
        <option value="employee">พนักงาน (ลงเวลา)</option>
        <option value="hr">HR (จัดการข้อมูลพนักงาน)</option>
        <option value="admin">ผู้ดูแลระบบ (กำหนดสิทธิ์ได้)</option>
      </select>
    </div>
    <label class="chk" id="mOffWrap"><input type="checkbox" id="mOff"> ระงับการใช้งานบัญชีนี้</label>
    <button id="mSave" class="primary">บันทึก</button>
    <div class="actions" id="mActions">
      <button id="mReset" class="gray">รีเซ็ต PIN</button>
      <button id="mDelete" class="danger">ลบพนักงาน</button>
    </div>
    <div style="text-align:center;margin-top:6px"><button id="mCancel" class="link">ยกเลิก</button></div>
    <div id="mMsg"></div>
  </div>
</div>

<script>
/* ===== ตั้งค่า: URL Web App ของ Apps Script (ลงท้าย /exec) ===== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyRsDB_c062D4bFtdCO37pFRWxn9WRUmMIf5qROMr8iZQ0yNqrGjykYdEGl8YCVbT_IIQ/exec';
/* ================================================================ */

const ROOT_CODE = 'tmdsp001';
const ROLE_LABEL = { employee:'พนักงาน', hr:'HR', admin:'ผู้ดูแลระบบ' };

const $ = id => document.getElementById(id);
const store = {
  get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
  del: k => { try { localStorage.removeItem(k); } catch (e) {} }
};
let state = { branch:null, nextType:'in', photo:null, busy:false, needSetPin:false, started:false, me:null, list:[] };

// รหัสอุปกรณ์แบบสุ่ม เก็บไว้ในเครื่อง ใช้ตรวจย้อนหลังว่าลงเวลาจากเครื่องไหน
let deviceId = store.get('deviceId');
if (!deviceId) {
  deviceId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).slice(0, 36);
  store.set('deviceId', deviceId);
}

/* ---------- เรียก backend (text/plain เพื่อเลี่ยง CORS preflight) ---------- */
async function api(payload) {
  const res = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
  return res.json();
}

// เรียกพร้อม token และจัดการเซสชันหมดอายุ
async function call(payload) {
  const r = await api({ ...payload, token: store.get('token') });
  if (!r.ok) {
    const e = new Error(r.error); e.code = r.code;
    if (e.code === 'AUTH') {
      store.del('token'); closeModal(); show('loginView'); setMsg($('loginMsg'), e.message, 'err');
    }
    throw e;
  }
  return r;
}

function show(id) {
  ['loading','loginView','mainView','manageView'].forEach(v => $(v).classList.toggle('hidden', v !== id));
}
function setMsg(el, text, kind) {
  el.innerHTML = '';
  if (!text) return;
  const d = document.createElement('div');
  d.className = 'msg ' + kind;
  d.textContent = text;
  el.appendChild(d);
}

/* ---------- เริ่มต้น ---------- */
async function init() {
  const savedCode = store.get('empCode');
  if (savedCode) $('empCode').value = savedCode;
  if (!store.get('token')) { show('loginView'); return; }
  try {
    await loadStatus();
  } catch (e) {
    if (e.code === 'AUTH') { store.del('token'); show('loginView'); setMsg($('loginMsg'), e.message, 'err'); }
    else { show('loginView'); setMsg($('loginMsg'), 'เชื่อมต่อไม่ได้: ' + e.message, 'err'); }
  }
}

async function loadStatus() {
  const r = await api({ action:'status', token:store.get('token') });
  if (!r.ok) { const e = new Error(r.error); e.code = r.code; throw e; }
  state.branch = r.branch;
  state.me = r.employee;
  $('empName').textContent = r.employee.name;
  $('empCode2').textContent = 'รหัส ' + r.employee.code + (r.employee.role !== 'employee' ? ' · ' + ROLE_LABEL[r.employee.role] : '');
  $('manageBtn').classList.toggle('hidden', !(r.employee.role === 'hr' || r.employee.role === 'admin'));
  state.nextType = r.nextType;
  renderToday(r.today);
  updateButton();
  applySchedule(r.schedule);
  show('mainView');
  if (!state.clockStarted) { state.clockStarted = true; startClock(); }
  if (r.schedule.required && !state.gpsStarted) { state.gpsStarted = true; startGps(); }
}

/* ---------- ตารางงานตามตำแหน่ง ---------- */
function applySchedule(sc) {
  state.sched = sc;
  ['clockCard', 'logCard', 'gpsRows'].forEach(id => $(id).classList.toggle('hidden', !sc.required));
  let t;
  if (!sc.required) t = 'ตำแหน่งของคุณไม่ต้องลงเวลาเข้า-ออกงาน';
  else if (sc.type === 'sales') {
    const wd = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'];
    const up = (sc.upcoming || []).map(s => {
      const p = s.split('-').map(Number);
      return wd[new Date(p[0], p[1] - 1, p[2]).getDay()] + ' ' + p[2] + '/' + p[1];
    });
    t = 'ตารางเข้าบริษัท: ' + (up.length ? up.join(' · ') : 'ยังไม่มีตารางงาน กรุณาติดต่อ HR') + ' · ' + sc.start + '-' + sc.end;
  } else {
    t = 'วันทำงาน ' + (sc.days.join(',') === 'จ,อ,พ,พฤ,ศ,ส' ? 'จ-ส' : sc.days.join(' ')) + ' · ' + sc.start + '-' + sc.end;
  }
  if (sc.required && !sc.todayWorkday) t += ' (วันนี้ไม่ใช่วันทำงานตามตาราง)';
  $('schedText').textContent = t;
}

/* ---------- เข้าสู่ระบบ ---------- */
async function doLogin() {
  const code = $('empCode').value.trim();
  const pin = $('pin').value.trim();
  if (!code) return setMsg($('loginMsg'), 'กรุณากรอกรหัสพนักงาน', 'err');
  if (!/^\d{4,6}$/.test(pin)) return setMsg($('loginMsg'), 'PIN ต้องเป็นตัวเลข 4-6 หลัก', 'err');

  if (state.needSetPin && pin !== $('pin2').value.trim()) {
    return setMsg($('loginMsg'), 'PIN ทั้งสองช่องไม่ตรงกัน', 'err');
  }

  $('loginBtn').disabled = true;
  setMsg($('loginMsg'), '');
  try {
    const r = await api({ action: state.needSetPin ? 'setpin' : 'login', employeeCode:code, pin });
    if (!r.ok) {
      if (r.code === 'NEED_SET_PIN') {
        state.needSetPin = true;
        $('pin2').classList.remove('hidden');
        $('loginHint').textContent = 'เข้าใช้งานครั้งแรก กรุณาตั้ง PIN (ตัวเลข 4-6 หลัก) และกรอกยืนยัน';
        $('loginBtn').textContent = 'ตั้ง PIN และเข้าสู่ระบบ';
        return;
      }
      throw new Error(r.error);
    }
    store.set('token', r.token);
    store.set('empCode', r.employee.code);
    $('pin').value = ''; $('pin2').value = '';
    state.needSetPin = false;
    $('pin2').classList.add('hidden');
    $('loginBtn').textContent = 'เข้าสู่ระบบ';
    $('loginHint').textContent = 'กรอกรหัสพนักงานและ PIN';
    await loadStatus();
  } catch (e) {
    setMsg($('loginMsg'), e.message, 'err');
  } finally { $('loginBtn').disabled = false; }
}
$('loginBtn').onclick = doLogin;
['empCode','pin','pin2'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); }));
$('empCode').addEventListener('input', () => {
  if (state.needSetPin) { // เปลี่ยนรหัสพนักงาน ให้กลับไปโหมดปกติ
    state.needSetPin = false; $('pin2').classList.add('hidden');
    $('loginBtn').textContent = 'เข้าสู่ระบบ'; $('loginHint').textContent = 'กรอกรหัสพนักงานและ PIN';
  }
});

$('logoutBtn').onclick = () => {
  store.del('token');
  state.photo = null; state.me = null;
  resetPhoto();
  setMsg($('actionMsg'), '');
  show('loginView');
};

/* ---------- นาฬิกา ---------- */
function startClock() {
  const tick = () => {
    const d = new Date();
    $('clock').textContent = d.toLocaleTimeString('th-TH', { hour12:false });
    $('dateText').textContent = d.toLocaleDateString('th-TH', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  };
  tick(); setInterval(tick, 1000);
}

/* ---------- GPS ---------- */
function distanceM(lat1, lng1, lat2, lng2) {
  const R = 6371000, rad = Math.PI/180;
  const dLat = (lat2-lat1)*rad, dLng = (lng2-lng1)*rad;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}

function startGps() {
  if (!navigator.geolocation) {
    $('gpsPill').className = 'pill bad'; $('gpsPill').textContent = 'อุปกรณ์ไม่รองรับ GPS'; return;
  }
  navigator.geolocation.watchPosition(pos => {
    const d = distanceM(pos.coords.latitude, pos.coords.longitude, state.branch.lat, state.branch.lng);
    const inside = d <= state.branch.radiusM;
    $('distText').textContent = Math.round(d) + ' ม. (GPS ±' + Math.round(pos.coords.accuracy) + ' ม.)';
    $('gpsPill').className = 'pill ' + (inside ? 'ok' : 'bad');
    $('gpsPill').textContent = inside ? 'อยู่ในพื้นที่' : 'อยู่นอกพื้นที่';
  }, err => {
    $('gpsPill').className = 'pill bad';
    $('gpsPill').textContent = err.code === 1 ? 'ยังไม่อนุญาตตำแหน่ง' : 'หาตำแหน่งไม่ได้';
  }, { enableHighAccuracy:true, maximumAge:5000, timeout:20000 });
}

function getFreshPosition() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(p => resolve(p.coords),
      e => reject(new Error(e.code === 1 ? 'กรุณาอนุญาตการเข้าถึงตำแหน่งในเบราว์เซอร์/มือถือ' : 'หาตำแหน่งไม่ได้ กรุณาลองใหม่')),
      { enableHighAccuracy:true, maximumAge:0, timeout:20000 });
  });
}

/* ---------- ปุ่ม/รายการ ---------- */
function updateButton() {
  const isIn = state.nextType === 'in';
  $('takePhotoBtn').textContent = isIn ? '📷 ถ่ายรูปเพื่อลงเวลาเข้างาน' : '📷 ถ่ายรูปเพื่อลงเวลาออกงาน';
  $('takePhotoBtn').className = 'btn' + (isIn ? '' : ' out');
  $('submitBtn').textContent = isIn ? 'ยืนยันเข้างาน' : 'ยืนยันออกงาน';
  $('submitBtn').className = isIn ? '' : 'out';
}

function renderToday(list) {
  const box = $('todayLog');
  box.innerHTML = '';
  if (!list || !list.length) { box.innerHTML = '<div class="muted">ยังไม่มีบันทึก</div>'; return; }
  list.forEach(r => {
    const row = document.createElement('div'); row.className = 'log';
    const a = document.createElement('span'); a.textContent = r.type === 'in' ? '🟢 เข้างาน' : '🔴 ออกงาน';
    const b = document.createElement('b'); b.textContent = r.time;
    row.append(a, b); box.appendChild(row);
  });
}

/* ---------- ถ่ายรูป + ย่อขนาด ---------- */
$('photoInput').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    state.photo = await compress(file, 640, 0.7);
    $('previewImg').src = state.photo;
    $('previewBox').classList.remove('hidden');
    $('takePhotoBtn').classList.add('hidden');
    setMsg($('actionMsg'), '');
  } catch (err) {
    setMsg($('actionMsg'), 'อ่านรูปไม่สำเร็จ กรุณาถ่ายใหม่', 'err');
  }
};

function compress(file, maxW, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxW / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = url;
  });
}

/* ---------- กล้องในหน้าเว็บ (เปิดกล้องตรง ไม่ผ่านแกลเลอรี) ---------- */
let camStream = null;

async function openCamera() {
  setMsg($('actionMsg'), '');
  // อุปกรณ์ที่ไม่รองรับกล้องในหน้าเว็บ ใช้ช่องเลือกไฟล์สำรอง
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { $('photoInput').click(); return; }
  setMsg($('camMsg'), '');
  $('camModal').classList.remove('hidden');
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false
    });
    $('camVideo').srcObject = camStream;
    await $('camVideo').play().catch(() => {});
  } catch (e) {
    closeCamera();
    setMsg($('actionMsg'),
      (e.name === 'NotAllowedError' || e.name === 'SecurityError')
        ? 'กรุณาอนุญาตการใช้กล้องในเบราว์เซอร์/มือถือ แล้วลองใหม่'
        : 'เปิดกล้องไม่ได้: ' + (e.message || e.name), 'err');
  }
}

function closeCamera() {
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  $('camVideo').srcObject = null;
  $('camModal').classList.add('hidden');
}

$('takePhotoBtn').onclick = openCamera;
$('camCancel').onclick = closeCamera;
$('shutterBtn').onclick = () => {
  const v = $('camVideo');
  if (!v.videoWidth) return setMsg($('camMsg'), 'กล้องยังไม่พร้อม รอสักครู่แล้วกดใหม่', 'err');
  const scale = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(v.videoWidth * scale);
  c.height = Math.round(v.videoHeight * scale);
  c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
  state.photo = c.toDataURL('image/jpeg', 0.7);
  $('previewImg').src = state.photo;
  $('previewBox').classList.remove('hidden');
  $('takePhotoBtn').classList.add('hidden');
  closeCamera();
};

$('retakeBtn').onclick = () => { resetPhoto(); openCamera(); };
function resetPhoto() {
  state.photo = null;
  $('previewBox').classList.add('hidden');
  $('takePhotoBtn').classList.remove('hidden');
}

/* ---------- ยืนยันลงเวลา ---------- */
$('submitBtn').onclick = async () => {
  if (state.busy) return;
  state.busy = true;
  $('submitBtn').disabled = true; $('retakeBtn').disabled = true;
  setMsg($('actionMsg'), 'กำลังตรวจตำแหน่งและบันทึก...', 'good');
  try {
    const p = await getFreshPosition();
    const r = await api({
      action:'checkin', token:store.get('token'), type:state.nextType,
      lat:p.latitude, lng:p.longitude, accuracy:p.accuracy,
      photo:state.photo, deviceId
    });
    if (!r.ok) { const e = new Error(r.error); e.code = r.code; throw e; }
    setMsg($('actionMsg'), (r.type === 'in' ? 'ลงเวลาเข้างานสำเร็จ ' : 'ลงเวลาออกงานสำเร็จ ') + r.time +
      (r.status && r.status !== 'ปกติ' ? ' · ' + r.status : ''), 'good');
    resetPhoto();
    await refreshToday();
  } catch (e) {
    if (e.code === 'AUTH') { store.del('token'); show('loginView'); setMsg($('loginMsg'), e.message, 'err'); }
    else setMsg($('actionMsg'), e.message, 'err');
  } finally {
    state.busy = false;
    $('submitBtn').disabled = false; $('retakeBtn').disabled = false;
  }
};

async function refreshToday() {
  try {
    const r = await api({ action:'status', token:store.get('token') });
    if (r.ok) { state.nextType = r.nextType; renderToday(r.today); updateButton(); }
  } catch (e) {}
}

/* ================= จัดการพนักงาน ================= */
$('manageBtn').onclick = async () => {
  show('manageView');
  setMsg($('manageMsg'), '');
  $('searchBox').value = '';
  await loadEmployees();
};
$('backBtn').onclick = () => { closeModal(); loadStatus().catch(() => show('mainView')); };
$('searchBox').addEventListener('input', renderList);
$('addEmpBtn').onclick = () => openModal('create', null);
async function loadEmployees() {
  $('empList').innerHTML = '<div class="muted">กำลังโหลด...</div>';
  try {
    const r = await call({ action:'listEmployees' });
    state.list = r.employees;
    state.positions = r.positions || [];
    renderList();
  } catch (e) {
    $('empList').innerHTML = '';
    setMsg($('manageMsg'), e.message, 'err');
  }
}

function addBadge(parent, text, cls) {
  const b = document.createElement('span');
  b.className = 'badge' + (cls ? ' ' + cls : '');
  b.textContent = text;
  parent.appendChild(b);
}

function renderList() {
  const q = $('searchBox').value.trim().toLowerCase();
  const box = $('empList');
  box.innerHTML = '';
  const items = (state.list || []).filter(e => !q || e.code.toLowerCase().includes(q) || e.name.toLowerCase().includes(q));
  if (!items.length) { box.innerHTML = '<div class="muted">ไม่พบพนักงาน</div>'; return; }
  items.forEach(e => {
    const row = document.createElement('div');
    row.className = 'emp ' + (e.editable ? 'click' : 'dim');
    const left = document.createElement('div');
    const nm = document.createElement('div'); nm.className = 'nm'; nm.textContent = e.name || '(ไม่มีชื่อ)';
    const cd = document.createElement('div'); cd.className = 'muted'; cd.textContent = e.code + (e.isSelf ? ' (คุณ)' : '') + (e.position ? ' · ' + e.position : '');
    left.append(nm, cd);
    const right = document.createElement('div'); right.className = 'badges';
    if (e.role !== 'employee') addBadge(right, ROLE_LABEL[e.role], e.role);
    if (e.disabled) addBadge(right, 'ระงับ', 'off');
    if (!e.hasPin) addBadge(right, 'ยังไม่ตั้ง PIN', '');
    row.append(left, right);
    if (e.editable) row.onclick = () => openModal('update', e);
    box.appendChild(row);
  });
}

/* ---------- ฟอร์มเพิ่ม/แก้ไข ---------- */
let modalCtx = null;
const dateVal = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') ? s : '';

function fillPositions(cur) {
  const sel = $('mPos');
  sel.innerHTML = '';
  const add = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); };
  const list = state.positions || [];
  add('', '— เลือกตำแหน่ง —');
  list.forEach(p => add(p, p));
  if (cur && list.indexOf(cur) < 0) add(cur, cur + ' (ค่าเดิม)');
  sel.value = cur || '';
}


function openModal(mode, e) {
  modalCtx = { mode, target: e };
  const isCreate = mode === 'create';
  const isAdmin = state.me && state.me.role === 'admin';
  const isRootT = !isCreate && e.code.toLowerCase() === ROOT_CODE;
  const isSelf = !isCreate && e.isSelf;

  $('mTitle').textContent = isCreate ? 'เพิ่มพนักงาน' : 'แก้ไขพนักงาน';
  $('mCode').value = isCreate ? '' : e.code;
  $('mCode').readOnly = !isCreate;
  $('mName').value = isCreate ? '' : e.name;
  fillPositions(isCreate ? '' : (e.position || ''));  $('mStart').value = isCreate ? '' : dateVal(e.startDate);
  $('mBirth').value = isCreate ? '' : dateVal(e.birthDate);
  $('mSalary').value = isCreate ? '' : (e.salary || '');
  $('mRole').value = isCreate ? 'employee' : e.role;
  $('mRoleWrap').classList.toggle('hidden', !(isAdmin && !isRootT && !isSelf));
  $('mOffWrap').classList.toggle('hidden', isCreate || isRootT || isSelf);
  $('mOff').checked = !isCreate && e.disabled;
  $('mActions').classList.toggle('hidden', isCreate || isRootT || isSelf);
  setMsg($('mMsg'), '');
  $('modal').classList.remove('hidden');
}

function closeModal() { $('modal').classList.add('hidden'); modalCtx = null; }
$('mCancel').onclick = closeModal;
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });

function setModalBusy(b) {
  ['mSave','mReset','mDelete','mCancel'].forEach(id => $(id).disabled = b);
}

$('mSave').onclick = async () => {
  const ctx = modalCtx;
  if (!ctx) return;
  const code = $('mCode').value.trim();
  const name = $('mName').value.trim();
  if (!code) return setMsg($('mMsg'), 'กรุณากรอกรหัสพนักงาน', 'err');
  if (!name) return setMsg($('mMsg'), 'กรุณากรอกชื่อ-สกุล', 'err');
  const roleVisible = !$('mRoleWrap').classList.contains('hidden');
  const prof = {
    position: $('mPos').value.trim(), startDate: $('mStart').value,
    birthDate: $('mBirth').value, salary: $('mSalary').value.trim()
  };

  setModalBusy(true);
  setMsg($('mMsg'), '');
  try {
    if (ctx.mode === 'create') {
      await call({ action:'saveEmployee', mode:'create', code, name, ...prof, role: roleVisible ? $('mRole').value : 'employee' });
    } else {
      await call({ action:'saveEmployee', mode:'update', code, name, ...prof, disabled: $('mOff').checked });
      if (roleVisible && $('mRole').value !== ctx.target.role) {
        await call({ action:'setRole', code, role: $('mRole').value });
      }
    }
    closeModal();
    await loadEmployees();
    setMsg($('manageMsg'), 'บันทึกแล้ว', 'good');
  } catch (e) {
    if ($('modal').classList.contains('hidden')) return; // เซสชันหมดอายุ
    setMsg($('mMsg'), e.message, 'err');
  } finally { setModalBusy(false); }
};

$('mReset').onclick = async () => {
  const ctx = modalCtx;
  if (!ctx || !confirm('รีเซ็ต PIN ของ ' + ctx.target.name + ' ?\nพนักงานต้องตั้ง PIN ใหม่เมื่อเข้าสู่ระบบครั้งถัดไป')) return;
  setModalBusy(true);
  try {
    await call({ action:'resetPin', code: ctx.target.code });
    closeModal();
    await loadEmployees();
    setMsg($('manageMsg'), 'รีเซ็ต PIN แล้ว แจ้งพนักงานให้ตั้ง PIN ใหม่ทันที', 'good');
  } catch (e) {
    if (!$('modal').classList.contains('hidden')) setMsg($('mMsg'), e.message, 'err');
  } finally { setModalBusy(false); }
};

$('mDelete').onclick = async () => {
  const ctx = modalCtx;
  if (!ctx || !confirm('ลบพนักงาน ' + ctx.target.name + ' (' + ctx.target.code + ') ?\nประวัติการลงเวลาเดิมยังอยู่ในชีต Attendance')) return;
  setModalBusy(true);
  try {
    await call({ action:'deleteEmployee', code: ctx.target.code });
    closeModal();
    await loadEmployees();
    setMsg($('manageMsg'), 'ลบพนักงานแล้ว', 'good');
  } catch (e) {
    if (!$('modal').classList.contains('hidden')) setMsg($('mMsg'), e.message, 'err');
  } finally { setModalBusy(false); }
};

init();
</script>
